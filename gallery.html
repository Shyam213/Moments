<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@200;300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:   #1a1612;
      --cream: #f5f0e8;
      --gold:  #b89b6a;
      --muted: #8a7f72;
      --card-bg: #201d19;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--ink);
      color: var(--cream);
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      min-height: 100vh;
      opacity: 0;
      animation: pageIn 0.8s ease 0.1s forwards;
    }
    @keyframes pageIn { to { opacity: 1; } }

    /* grain */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 1000;
      opacity: 0.45;
      animation: grain 0.8s steps(1) infinite;
    }
    @keyframes grain {
      0%,100%{background-position:0 0} 10%{background-position:-5% -10%}
      20%{background-position:-15% 5%} 30%{background-position:7% -25%}
      40%{background-position:-5% 25%} 50%{background-position:-15% 10%}
      60%{background-position:15% 0} 70%{background-position:0 15%}
      80%{background-position:3% 35%} 90%{background-position:-10% 10%}
    }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      padding: 1.4rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(26,22,18,0.95) 80%, transparent);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(184,155,106,0.12);
    }

    .header-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      color: var(--cream);
    }
    .header-logo em { color: var(--gold); font-style: italic; }

    .header-meta {
      font-size: 0.58rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── HERO ── */
    .hero {
      padding: 6rem 3rem 3rem;
      text-align: center;
    }
    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      line-height: 1.1;
    }
    .hero-title em { color: var(--gold); font-style: italic; }
    .hero-sub {
      margin-top: 1rem;
      font-size: 0.62rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .hero-line {
      width: 80px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 2rem auto;
    }

    /* ── MASONRY GALLERY ── */
    .gallery-section {
      padding: 2rem 3rem 6rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .masonry {
      columns: 3;
      column-gap: 1.2rem;
    }
    @media (max-width: 900px) { .masonry { columns: 2; } }
    @media (max-width: 560px) { .masonry { columns: 1; } }

    .photo-card {
      break-inside: avoid;
      margin-bottom: 1.2rem;
      position: relative;
      overflow: hidden;
      background: var(--card-bg);
      cursor: pointer;
    }

    .photo-card img {
      width: 100%;
      display: block;
      transition: transform 0.6s cubic-bezier(0.16,1,0.3,1), filter 0.5s ease;
      filter: brightness(0.92) saturate(0.9);
    }
    .photo-card:hover img {
      transform: scale(1.04);
      filter: brightness(1) saturate(1.05);
    }

    /* overlay on hover */
    .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(26,22,18,0.75) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.4s ease;
      display: flex;
      align-items: flex-end;
      padding: 1.2rem;
    }
    .photo-card:hover .card-overlay { opacity: 1; }

    .card-caption {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 300;
      font-style: italic;
      color: var(--cream);
      letter-spacing: 0.05em;
      transform: translateY(6px);
      transition: transform 0.4s ease;
    }
    .photo-card:hover .card-caption { transform: translateY(0); }

    /* gold border flash on hover */
    .photo-card::after {
      content: '';
      position: absolute; inset: 0;
      border: 1px solid rgba(184,155,106,0);
      transition: border-color 0.4s ease;
      pointer-events: none;
    }
    .photo-card:hover::after { border-color: rgba(184,155,106,0.45); }

    /* scroll reveal */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.16,1,0.3,1);
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(10,8,6,0.95);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .lightbox.open { opacity: 1; pointer-events: all; }

    .lb-img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      box-shadow: 0 40px 120px rgba(0,0,0,0.8);
      transform: scale(0.95);
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
    }
    .lightbox.open .lb-img { transform: scale(1); }

    .lb-close {
      position: absolute;
      top: 2rem; right: 2.5rem;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s;
    }
    .lb-close:hover { color: var(--gold); }

    .lb-caption {
      position: absolute;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .lb-nav {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s;
      padding: 1rem;
    }
    .lb-nav:hover { color: var(--gold); }
    .lb-prev { left: 1.5rem; }
    .lb-next { right: 1.5rem; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid rgba(184,155,106,0.12);
      padding: 2rem 3rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    footer p {
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .logout-btn {
      background: transparent;
      border: none;
      font-family: 'Jost', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      margin-left: 3rem;
      transition: color 0.2s;
    }
    .logout-btn:hover { color: var(--gold); }
  </style>
</head>
<body>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <span class="lb-close" id="lbClose">✕ Close</span>
    <span class="lb-nav lb-prev" id="lbPrev">← Prev</span>
    <img class="lb-img" id="lbImg" src="" alt=""/>
    <span class="lb-nav lb-next" id="lbNext">Next →</span>
    <p class="lb-caption" id="lbCap"></p>
  </div>

  <!-- HEADER -->
  <header>
    <div class="header-logo">Mo<em>ments</em></div>
    <div class="header-meta">Private Gallery</div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1 class="hero-title">A <em>Collection</em> of<br>Quiet Moments</h1>
    <p class="hero-sub">Curated · Personal · Private</p>
    <div class="hero-line"></div>
  </section>

  <!-- GALLERY -->
  <section class="gallery-section">
    <div class="masonry" id="masonry">
      <!-- Cards are injected by JS -->
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2025 — All rights reserved</p>
    <button class="logout-btn" onclick="window.location.href='index.html'">← Exit Gallery</button>
  </footer>

  <script>
    /*
    ╔══════════════════════════════════════════════════════════════════╗
    ║  PHOTO CONFIGURATION — replace these with your own images!      ║
    ║                                                                  ║
    ║  Each entry:                                                     ║
    ║    src:     path to your image file                              ║
    ║    caption: text shown on hover / in lightbox                    ║
    ║                                                                  ║
    ║  Where to put your photos → see guide below in the README       ║
    ╚══════════════════════════════════════════════════════════════════╝
    */
    const photos = [
      { src: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800",  caption: "Mountain Stillness" },
      { src: "https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=800",  caption: "Golden Fields" },
      { src: "https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?w=800",  caption: "Misty Morning" },
      { src: "https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?w=800",  caption: "Lake Reflections" },
      { src: "https://images.unsplash.com/photo-1448375240586-882707db888b?w=800",  caption: "Forest Path" },
      { src: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800",  caption: "Desert Dusk" },
      { src: "https://images.unsplash.com/photo-1504701954957-2010ec3bcec1?w=800",  caption: "Coastal Calm" },
      { src: "https://images.unsplash.com/photo-1501854140801-50d01698950b?w=800",  caption: "Valley Light" },
      { src: "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800",  caption: "Starlit Peaks" },
      { src: "https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=800",  caption: "Waterfall" },
      { src: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800",  caption: "Alpine Glow" },
      { src: "https://images.unsplash.com/photo-1494500764479-0c8f2919a3d8?w=800",  caption: "Night Sky" },
    ];

    // ── Build masonry cards ──────────────────────────────────────────
    const masonry = document.getElementById('masonry');

    photos.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'photo-card reveal';
      card.style.transitionDelay = `${(i % 6) * 0.07}s`;
      card.innerHTML = `
        <img src="${p.src}" alt="${p.caption}" loading="lazy"/>
        <div class="card-overlay">
          <span class="card-caption">${p.caption}</span>
        </div>`;
      card.addEventListener('click', () => openLightbox(i));
      masonry.appendChild(card);
    });

    // ── Scroll reveal ────────────────────────────────────────────────
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
    }, { threshold: 0.08 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // ── Lightbox ─────────────────────────────────────────────────────
    let current = 0;
    const lb    = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbCap = document.getElementById('lbCap');

    function openLightbox(idx) {
      current = idx;
      lbImg.src = photos[idx].src;
      lbCap.textContent = photos[idx].caption;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }
    function navigate(dir) {
      current = (current + dir + photos.length) % photos.length;
      lbImg.src = photos[current].src;
      lbCap.textContent = photos[current].caption;
    }

    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    document.getElementById('lbPrev').addEventListener('click', () => navigate(-1));
    document.getElementById('lbNext').addEventListener('click', () => navigate(1));
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });
  </script>

</body>
</html>
